<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Pro - Automated Video Distribution Tool</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090e1a;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      max-width: 720px;
      margin: 0 auto;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 9999px;
      color: #38bdf8;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0 0 16px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 0 28px;
    }
    footer {
      border-top: 1px solid #1e293b;
      padding: 24px 20px;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
    }
    footer a {
      color: #94a3b8;
      text-decoration: none;
      margin: 0 10px;
    }
    footer a:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="badge">Social Pro Platform</div>
    <h1>Automated Multi-Platform Video Publishing</h1>
    <p>Social Pro is a self-hosted media publishing application designed to upload and distribute video content to connected YouTube and TikTok accounts.</p>
  </div>
  <footer>
    <div>&copy; 2026 Social Pro. All rights reserved.</div>
    <div style="margin-top: 8px;">
      <a href="terms.html">Terms of Service</a> &bull;
      <a href="privacy.html">Privacy Policy</a>
    </div>
  </footer>
</body>
</html>
