<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Pro - TikTok OAuth Relay</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090e1a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #111827;
      padding: 36px 32px;
      border-radius: 14px;
      border: 1px solid #1f2937;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 440px;
      width: 100%;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #25f4ee;
      border-right-color: #fe2c55;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h3 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.85rem;
      line-height: 1.5;
      margin: 0 0 16px;
    }
    .manual-link {
      display: inline-block;
      margin-top: 12px;
      color: #38bdf8;
      font-size: 0.8rem;
      text-decoration: none;
    }
    .manual-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h3>Menghubungkan ke Social Pro...</h3>
    <p>Otorisasi TikTok berhasil! Meneruskan sesi kembali ke aplikasi Social Pro lokal Anda.</p>
    <a id="fallbackLink" class="manual-link" href="#">Klik di sini jika browser tidak otomatis dialihkan</a>
  </div>

  <script>
    // Ambil parameter code dan state dari TikTok
    const searchParams = window.location.search;
    const localCallbackUrl = 'http://localhost:4000/v1/oauth/tiktok/callback' + searchParams;

    // Pasang fallback link jika redirect terhalang
    document.getElementById('fallbackLink').href = localCallbackUrl;

    // Otomatis forward ke localhost
    window.location.replace(localCallbackUrl);
  </script>
</body>
</html>
